<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheel Humanoid joint control</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "urdf-loader": "https://cdn.jsdelivr.net/npm/urdf-loader@0.12.4/src/URDFLoader.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <section id="viewport">
      <div class="hud">
        <h1>Wheel Humanoid</h1>
        <p>24 actuated DOF · drag a slider to override that motor in Isaac Sim</p>
        <div id="isaac-status" class="status offline">Isaac Sim: offline</div>
        <div id="cmd-readout" class="cmd-readout">vx 0.00 · yaw 0.00</div>
        <div id="pose-readout" class="cmd-readout">pose ppo</div>
      </div>
      <div class="views">
        <button data-view="iso">Iso</button>
        <button data-view="front">Front</button>
        <button data-view="side">Side</button>
        <button data-view="top">Top</button>
      </div>
      <div id="loader">
        <div class="loader-card">
          <h3>Loading robot</h3>
          <p id="load-status">Reading URDF and STL…</p>
          <div class="bar"><span id="load-bar"></span></div>
          <div id="error"></div>
        </div>
      </div>
    </section>

    <aside id="sidebar">
      <div class="side-head">
        <h2>Joint control</h2>
        <div class="preset-row pose-row">
          <button id="pose-kneel" type="button" data-pose="kneel">Kneel (4 wheels)</button>
          <button id="pose-stand" type="button" data-pose="stand">Stand up</button>
        </div>
        <div class="preset-row pose-row">
          <button id="pose-slide" type="button" data-pose="slide">Slide (X2 skate)</button>
          <button id="pose-skate" type="button" data-pose="skate">Balance skate</button>
        </div>
        <div class="preset-row">
          <button data-preset="zero">Zero</button>
          <button data-preset="tpose">T-pose</button>
          <button data-preset="reach">Reach</button>
        </div>
        <div class="toolbar" style="margin-top:8px">
          <button id="reset">Zero all</button>
          <button id="copy">Copy JSON</button>
          <button id="follow-all">Release all to PPO</button>
          <button id="reset-sim">Reset sim</button>
        </div>
        <div class="toggles">
          <label><input id="mirror" type="checkbox"> Mirror L/R</label>
          <label><input id="spin-wheels" type="checkbox"> Spin wheels</label>
        </div>
      </div>
      <div id="joints" class="joint-list"></div>
      <div class="export">
        <textarea id="joint-json" readonly spellcheck="false"></textarea>
      </div>
    </aside>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
